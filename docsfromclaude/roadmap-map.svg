<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 680 1320" role="img">
  <title>Lawgic strategic roadmap</title>
  <desc>Three-phase 18-month roadmap: Prove, Sovereign, Expand. Shows repositioning from legal AI to sovereign GRC platform with hub-and-spoke EU architecture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .t { font-size: 14px; font-weight: 400; fill: #1a1a1a; }
    .ts { font-size: 12px; font-weight: 400; fill: #555; }
    .arr { stroke: #888; stroke-width: 1.5; fill: none; }
    .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray .th { fill: #2C2C2A; }
    .c-gray .ts { fill: #444441; }
    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th { fill: #04342C; }
    .c-teal .ts { fill: #0F6E56; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th { fill: #26215C; }
    .c-purple .ts { fill: #3C3489; }
    .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral .th { fill: #4A1B0C; }
    .c-coral .ts { fill: #712B13; }
    .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .th { fill: #412402; }
    .c-amber .ts { fill: #633806; }
    .c-pink rect { fill: #FBEAF0; stroke: #993556; }
    .c-pink .th { fill: #4B1528; }
    .c-pink .ts { fill: #72243E; }
    .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue .th { fill: #042C53; }
    .c-blue .ts { fill: #0C447C; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="340" y="32" text-anchor="middle" style="font-size:18px">Lawgic — strategic repositioning map</text>
  <text class="ts" x="340" y="52" text-anchor="middle">From Greek legal AI to sovereign EU compliance OS</text>

  <g class="c-gray">
    <rect x="40" y="80" width="600" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="106">The reposition</text>
    <text class="ts" x="60" y="126">Not a legal AI tool. AI-native sovereign GRC platform.</text>
    <text class="ts" x="60" y="142">Buyer: Chief Compliance Officer + CISO, not General Counsel.</text>
  </g>

  <text class="th" x="40" y="188">Phase 1 — prove (months 0–6)</text>
  <text class="ts" x="40" y="206">Land 2–3 paying design partners. DORA as the wedge.</text>

  <g class="c-teal">
    <rect x="40" y="222" width="190" height="90" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="246">DORA RoI module</text>
    <text class="ts" x="60" y="266">Register of Information</text>
    <text class="ts" x="60" y="282">46% cite as hardest</text>
    <text class="ts" x="60" y="298">€150–400K ACV target</text>
  </g>

  <g class="c-teal">
    <rect x="245" y="222" width="190" height="90" rx="8" stroke-width="0.5"/>
    <text class="th" x="265" y="246">Design partners</text>
    <text class="ts" x="265" y="266">Alpha Bank — DORA</text>
    <text class="ts" x="265" y="282">DoValue — DORA+AML</text>
    <text class="ts" x="265" y="298">AADE — AI Act</text>
  </g>

  <g class="c-teal">
    <rect x="450" y="222" width="190" height="90" rx="8" stroke-width="0.5"/>
    <text class="th" x="470" y="246">90-day pilot spec</text>
    <text class="ts" x="470" y="266">RoI generation</text>
    <text class="ts" x="470" y="282">Gap analysis + evidence</text>
    <text class="ts" x="470" y="298">Audit-ready export</text>
  </g>

  <line x1="340" y1="330" x2="340" y2="362" class="arr" marker-end="url(#arrow)"/>

  <text class="th" x="40" y="390">Phase 2 — sovereign (months 4–12)</text>
  <text class="ts" x="40" y="408">Move infrastructure to EU-sovereign hosts. Add EU-sovereign models.</text>

  <g class="c-purple">
    <rect x="40" y="424" width="190" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="448">Sovereign hosting</text>
    <text class="ts" x="60" y="468">OVHcloud / Outscale</text>
    <text class="ts" x="60" y="484">SecNumCloud 3.2</text>
    <text class="ts" x="60" y="500">GRNET for Greek gov</text>
    <text class="ts" x="60" y="516">Publish attestations</text>
  </g>

  <g class="c-purple">
    <rect x="245" y="424" width="190" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="265" y="448">Sovereign models</text>
    <text class="ts" x="265" y="468">Mistral enterprise</text>
    <text class="ts" x="265" y="484">Fine-tuned Qwen 27B</text>
    <text class="ts" x="265" y="500">No training on data</text>
    <text class="ts" x="265" y="516">Contractual guarantee</text>
  </g>

  <g class="c-purple">
    <rect x="450" y="424" width="190" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="470" y="448">Deployment modes</text>
    <text class="ts" x="470" y="468">EU sovereign SaaS</text>
    <text class="ts" x="470" y="484">Private cloud tenant</text>
    <text class="ts" x="470" y="500">On-prem air-gapped</text>
    <text class="ts" x="470" y="516">Same codebase, 3 SKUs</text>
  </g>

  <line x1="340" y1="552" x2="340" y2="584" class="arr" marker-end="url(#arrow)"/>

  <text class="th" x="40" y="612">Phase 3 — expand (months 10–18)</text>
  <text class="ts" x="40" y="630">Hub-and-spoke EU architecture. Germany first.</text>

  <g class="c-coral">
    <rect x="40" y="646" width="600" height="90" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="670">EU regulatory hub — shared across all tenants</text>
    <text class="ts" x="60" y="690">DORA · AI Act · NIS2 · GDPR · CSRD · CRA · MiFID II · Data Act</text>
    <text class="ts" x="60" y="706">EUR-Lex · ECJ case law · ESAs · EDPB · ENISA</text>
    <text class="ts" x="60" y="722">Every new jurisdiction benefits from this hub instantly</text>
  </g>

  <line x1="140" y1="742" x2="140" y2="768" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="742" x2="340" y2="768" class="arr" marker-end="url(#arrow)"/>
  <line x1="540" y1="742" x2="540" y2="768" class="arr" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="40" y="776" width="190" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="800">Greek spoke — live</text>
    <text class="ts" x="60" y="820">FEK A/B · ΙΣΟΚΡΑΤΗΣ</text>
    <text class="ts" x="60" y="836">NOMOS · Diavgeia</text>
    <text class="ts" x="60" y="852">Supreme Court</text>
    <text class="ts" x="60" y="868">90y legislation · 350K cases</text>
  </g>

  <g class="c-amber">
    <rect x="245" y="776" width="190" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="265" y="800">German spoke — build</text>
    <text class="ts" x="265" y="820">Bundesanzeiger</text>
    <text class="ts" x="265" y="836">BGBl · BaFin · BSI</text>
    <text class="ts" x="265" y="852">Juris · BeckOnline</text>
    <text class="ts" x="265" y="868">NIS2UmsuCG enforcement</text>
  </g>

  <g class="c-amber">
    <rect x="450" y="776" width="190" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="470" y="800">French spoke — plan</text>
    <text class="ts" x="470" y="820">Légifrance · JORF</text>
    <text class="ts" x="470" y="836">ACPR · CNIL</text>
    <text class="ts" x="470" y="852">Cour de cassation</text>
    <text class="ts" x="470" y="868">SecNumCloud-aligned</text>
  </g>

  <g class="c-gray">
    <rect x="40" y="920" width="600" height="90" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="944">The 5 tools to build — 80% as good as Harvey</text>
    <text class="ts" x="60" y="964">1. Regulatory change monitoring with company-doc impact analysis — your edge</text>
    <text class="ts" x="60" y="980">2. Continuous compliance posture scoring (SREP) — nobody else has this</text>
    <text class="ts" x="60" y="996">3. Document review + clause extraction · 4. Cross-jurisdictional compare · 5. Drafting</text>
  </g>

  <g class="c-pink">
    <rect x="40" y="1030" width="600" height="90" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="1054">Don't build</text>
    <text class="ts" x="60" y="1074">US-centric tools · deposition prep · litigation analytics · billable-hour workflows</text>
    <text class="ts" x="60" y="1090">Law-firm seat-based sales · per-module pricing · anything Harvey already does well</text>
    <text class="ts" x="60" y="1106">Say no proudly — every unbuilt feature sharpens the positioning</text>
  </g>

  <g class="c-blue">
    <rect x="40" y="1140" width="600" height="150" rx="8" stroke-width="0.5"/>
    <text class="th" x="60" y="1164">What wins — the three commitments no US competitor can make</text>
    <text class="ts" x="60" y="1186">1. All inference inside EU sovereign infrastructure on EU-developed or open-weight models</text>
    <text class="ts" x="60" y="1204">2. Every output carries citation lineage to source with confidence intervals</text>
    <text class="ts" x="60" y="1222">3. No customer data ever leaves EU jurisdiction or trains shared models</text>
    <text class="ts" x="60" y="1248">Harvey cannot make #1 without rebuilding. OneTrust cannot make #2 without rebuilding.</text>
    <text class="ts" x="60" y="1266">Thomson Reuters / Wolters Kluwer struggle with all three. Window: 18 months.</text>
  </g>
</svg>
